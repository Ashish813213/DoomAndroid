<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;touch-action:none}
  .btn{position:fixed;z-index:99999;padding:8px 12px;border:2px solid #fff;border-radius:8px;
    background:rgba(0,0,0,.6);color:#fff;font:bold 14px sans-serif;user-select:none;
    -webkit-user-select:none;touch-action:none}
  #music{left:8px;bottom:8px}#fast{right:8px;bottom:8px;font-size:20px;min-width:56px;text-align:center}
  #pausebtn{position:static;padding:5px 9px;font-size:12px}
  #weapons{position:fixed;z-index:99999;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
  .wbtn{width:34px;height:28px;padding:0;border:2px solid #fff;border-radius:6px;background:rgba(0,0,0,.6);
    color:#fff;font:bold 14px sans-serif;text-align:center;line-height:24px;user-select:none;
    -webkit-user-select:none;touch-action:none}
  .wbtn.active{background:rgba(0,150,0,.85)}
  #savebar{position:fixed;z-index:99999;top:8px;right:8px;display:flex;gap:4px}
  #savebar .btn{position:static;padding:5px 9px;font-size:12px}
  #status{position:fixed;z-index:99999;top:8px;left:8px;color:#fff;font:12px sans-serif;
    background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;max-width:45%;white-space:nowrap;overflow:hidden}
  .overlay{position:fixed;z-index:100000;inset:0;background:rgba(0,0,0,.86);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    font:16px sans-serif;text-align:center;padding:20px;touch-action:none}
  .overlay.hidden{display:none}
  .overlay h1{font:bold 44px sans-serif;color:#d21;margin:0;text-shadow:3px 3px #000}
  .overlay h2{font:bold 26px sans-serif;color:#fd0;margin:0}
  .overlay .btn{position:static;font-size:16px;padding:10px 20px;min-width:220px}
  .overlay .small{font-size:12px;color:#aaa;max-width:560px;line-height:1.5}
  .overlay input{width:240px}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  /* Portrait: keep the 320:200 game aspect and centre it vertically */
  @media (orientation:portrait){
    #V{width:100vw !important;height:62.5vw !important}
    #status{max-width:60%}
  }
</style>
</head>
<body>
<script>
/* 3x logic; skip redundant canvas uploads while held for better performance */
window.__speed=1;window.__skipRender=false;
var _si=window.setInterval.bind(window);
window.setInterval=function(fn,ms){
 if(typeof ms==='number'&&Math.abs(ms-1000/35)<0.01){
  return _si(function(){
   for(var i=0,n=window.__speed|0;i<n;i++){window.__skipRender=i<n-1;fn()}
   window.__skipRender=false;
  },ms);
 }
 return _si(fn,ms);
};
var _pid=CanvasRenderingContext2D.prototype.putImageData;
CanvasRenderingContext2D.prototype.putImageData=function(){if(window.__skipRender)return;return _pid.apply(this,arguments)};
</script>
<script src="game.js"></script>
<script>
function block(e){e.stopPropagation()}
function bind(el){['touchstart','touchend','mousedown','mouseup','contextmenu'].forEach(function(t){
  el.addEventListener(t,function(e){e.stopPropagation();if(t==='contextmenu')e.preventDefault()},{passive:false})
})}
function mk(cls,text){var b=document.createElement('div');b.className=cls;b.textContent=text;bind(b);return b}

var statusEl=document.createElement('div');statusEl.id='status';statusEl.textContent='No song selected';document.body.appendChild(statusEl);
window.__saveMsg=function(t){statusEl.textContent=t;setTimeout(function(){statusEl.textContent=window.__musicName||'No song selected'},1800)};

var musicBtn=mk('btn','\u266A MUSIC');musicBtn.id='music';
musicBtn.addEventListener('click',function(e){block(e);Android.pickMusic()});document.body.appendChild(musicBtn);

var fastBtn=mk('btn','3x');fastBtn.id='fast';
function fastOn(e){block(e);window.__speed=3;fastBtn.style.background='rgba(0,150,0,.85)'}
function fastOff(e){block(e);window.__speed=1;fastBtn.style.background='rgba(0,0,0,.6)'}
['pointerdown','touchstart','mousedown'].forEach(function(t){fastBtn.addEventListener(t,fastOn,{passive:false})});
['pointerup','pointercancel','pointerleave','touchend','touchcancel','mouseup'].forEach(function(t){fastBtn.addEventListener(t,fastOff,{passive:false})});
document.body.appendChild(fastBtn);

var weapons=document.createElement('div');weapons.id='weapons';var wbtns=[];
['P','S','C','R'].forEach(function(label,n){var b=mk('wbtn',label);b.addEventListener('click',function(e){block(e);window.setWeapon(n);refreshWeapons()});weapons.appendChild(b);wbtns.push(b)});
document.body.appendChild(weapons);
function refreshWeapons(){var w=window.getGameState?window.getGameState().wp:0;wbtns.forEach(function(b,i){b.className='wbtn'+(i===w?' active':'')})}

var savebar=document.createElement('div');savebar.id='savebar';
[['SAVE',function(){window.saveGame()}],['LOAD',function(){window.loadGame();refreshWeapons()}],['II',function(){window.setPaused(true)}]].forEach(function(p){
 var b=mk('btn',p[0]);if(p[0]==='II')b.id='pausebtn';b.addEventListener('click',function(e){block(e);p[1]()});savebar.appendChild(b)
});
document.body.appendChild(savebar);

// ---------- overlays ----------
function makeOverlay(id){var d=document.createElement('div');d.className='overlay hidden';d.id=id;document.body.appendChild(d);return d}
var title=makeOverlay('title'),how=makeOverlay('how'),pauseOverlay=makeOverlay('pause'),over=makeOverlay('over');
var titleInfo=document.createElement('div');titleInfo.className='small';title.appendChild(titleInfo);
var h1=document.createElement('h1');h1.textContent='DOOM.QR';title.insertBefore(h1,titleInfo);
var h2=document.createElement('h2');h2.textContent='ANDROID EDITION';title.insertBefore(h2,titleInfo);

function button(parent,label,fn){var b=mk('btn',label);b.addEventListener('click',function(e){block(e);fn()});parent.appendChild(b);return b}
var btnNew=button(title,'NEW GAME',function(){hideAll();window.startGame();refreshWeapons()});
var btnCont=button(title,'CONTINUE',function(){hideAll();window.loadGame();refreshWeapons()});
var btnDaily=button(title,'DAILY CHALLENGE',function(){hideAll();window.startDaily();refreshWeapons()});
button(title,'HOW TO PLAY',function(){hideAll();how.classList.remove('hidden')});

var howText=document.createElement('div');howText.className='small';
howText.innerHTML='<b>Touch:</b> drag left half to turn / move, hold right half to fire.<br>'+
 '<b>Keys:</b> WASD / arrows move, Space fire, 1-4 weapons, Q cycle, P pause.<br>'+
 '<b>Weapons:</b> Pistol (infinite), Shotgun (spread), Chaingun (spread grows), Missile (splash + homes on flyers).<br>'+
 '<b>Enemies:</b> imps, flyers, swarmers, brutes, snipers and a boss every 5 waves.<br>'+
 '<b>Map:</b> new areas and corridors open as waves rise.<br>'+
 '<b>3x:</b> hold the 3x button. <b>MUSIC:</b> pick a song to loop it.<br>'+
 '<b>SAVE/LOAD:</b> store and restore your run.';
how.appendChild(howText);
button(how,'BACK',function(){hideAll()});

var pauseTitle=document.createElement('h2');pauseTitle.textContent='PAUSED';pauseOverlay.appendChild(pauseTitle);
var sliders=document.createElement('div');sliders.className='row';pauseOverlay.appendChild(sliders);
function slider(label,min,max,val,fn){
 var wrap=document.createElement('div');wrap.className='row';var l=document.createElement('span');l.textContent=label;
 var inp=document.createElement('input');inp.type='range';inp.min=min;inp.max=max;inp.step='0.05';inp.value=val;
 bind(inp);inp.addEventListener('input',function(){fn(parseFloat(inp.value))});wrap.appendChild(l);wrap.appendChild(inp);sliders.appendChild(wrap)
}
slider('MUSIC',0,1,1,function(v){Android.setMusicVolume&&Android.setMusicVolume(v)});
slider('TOUCH',0.4,2,1,function(v){window.setSensitivity(v)});
button(pauseOverlay,'RESUME',function(){hideAll();window.setPaused(false)});
button(pauseOverlay,'SAVE',function(){window.saveGame()});
button(pauseOverlay,'LOAD',function(){window.loadGame();hideAll()});
button(pauseOverlay,'RESTART',function(){hideAll();window.startGame()});
button(pauseOverlay,'TITLE',function(){hideAll();window.setPaused(false);window.startGame();title.classList.remove('hidden')});

var overTitle=document.createElement('h2');over.appendChild(overTitle);
var overInfo=document.createElement('div');overInfo.className='small';over.appendChild(overInfo);
button(over,'NEW GAME',function(){hideAll();window.startGame();refreshWeapons()});
button(over,'LOAD',function(){hideAll();window.loadGame();refreshWeapons()});
button(over,'TITLE',function(){hideAll();title.classList.remove('hidden')});

function hideAll(){[title,how,pauseOverlay,over].forEach(function(d){d.classList.add('hidden')})}
function updateUI(){
 var s=window.getGameState?window.getGameState():{mode:'title',paused:false};
 if(s.mode==='title'&&how.classList.contains('hidden')){if(title.classList.contains('hidden')){hideAll();title.classList.remove('hidden')}}
 else if(how.classList.contains('hidden')&&title.classList.contains('hidden')){
  if(s.paused){pauseOverlay.classList.remove('hidden');over.classList.add('hidden')}
  else{pauseOverlay.classList.add('hidden')}
  if(s.mode==='dead'||s.mode==='won'){over.classList.remove('hidden');overTitle.textContent=s.mode==='won'?'ESCAPED!':'YOU DIED';
    overInfo.textContent='Wave '+s.wave+'   Score '+s.score+'   Best '+(window.getMeta?window.getMeta().bestScore:0)}
  else over.classList.add('hidden');
 }
 var m=window.getMeta?window.getMeta():{};
 titleInfo.textContent='Best score: '+(m.bestScore||0)+'   Best wave: '+(m.bestWave||0)+'   Achievements: '+Object.keys(m.ach||{}).length+
  '\nDaily: '+(m.daily||'not done yet');
 btnCont.style.opacity=(window.Android&&Android.loadGame&&Android.loadGame())?1:.4;
}
setInterval(updateUI,200);

window.musicLoaded=function(name){window.__musicName=name;statusEl.textContent='Playing: '+name};
refreshWeapons();title.classList.remove('hidden');
</script>
</body>
</html>
