<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; touch-action:none; }
  .btn {
    position:fixed; z-index:99999; padding:8px 12px; border:2px solid #fff; border-radius:8px;
    background:rgba(0,0,0,.6); color:#fff; font:bold 14px sans-serif; user-select:none;
    -webkit-user-select:none; touch-action:none;
  }
  #music { left:8px; bottom:8px; }
  #fast  { right:8px; bottom:8px; font-size:20px; min-width:56px; text-align:center; }
  #weapons { position:fixed; z-index:99999; top:8px; left:50%; transform:translateX(-50%); display:flex; gap:4px; }
  .wbtn { width:34px; height:28px; padding:0; border:2px solid #fff; border-radius:6px;
    background:rgba(0,0,0,.6); color:#fff; font:bold 14px sans-serif; text-align:center;
    line-height:24px; user-select:none; -webkit-user-select:none; touch-action:none; }
  .wbtn.active { background:rgba(0,150,0,.85); }
  #savebar { position:fixed; z-index:99999; top:8px; right:8px; display:flex; gap:4px; }
  #savebar .btn { position:static; padding:5px 9px; font-size:12px; }
  #status { position:fixed; z-index:99999; top:8px; left:8px; color:#fff;
    font:12px sans-serif; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<script>
/* Run the game's 35 Hz loop 3 times per tick while the 3x button is held. */
window.__speed = 1;
var _si = window.setInterval.bind(window);
window.setInterval = function (fn, ms) {
  if (typeof ms === 'number' && Math.abs(ms - 1000 / 35) < 0.01) {
    return _si(function () {
      for (var i = 0, n = window.__speed | 0; i < n; i++) fn();
    }, ms);
  }
  return _si(fn, ms);
};
</script>
<script src="game.js"></script>
<script>
function block(e) { e.preventDefault(); e.stopPropagation(); }
function bind(el) {
  el.addEventListener('touchstart', block, {passive:false});
  el.addEventListener('touchend', block, {passive:false});
  el.addEventListener('mousedown', block);
  el.addEventListener('mouseup', block);
  el.addEventListener('contextmenu', block);
}

var statusEl = document.createElement('div');
statusEl.id = 'status'; statusEl.textContent = 'No song selected';
document.body.appendChild(statusEl);
window.__saveMsg = function (t) {
  statusEl.textContent = t;
  setTimeout(function () { statusEl.textContent = 'No song selected'; }, 1600);
};

var musicBtn = document.createElement('div');
musicBtn.className = 'btn'; musicBtn.id = 'music'; musicBtn.textContent = '\u266A MUSIC';
bind(musicBtn);
musicBtn.addEventListener('click', function (e) { block(e); Android.pickMusic(); });
document.body.appendChild(musicBtn);

var fastBtn = document.createElement('div');
fastBtn.className = 'btn'; fastBtn.id = 'fast'; fastBtn.textContent = '3x';
function fastOn(e) { block(e); window.__speed = 3; fastBtn.style.background = 'rgba(0,150,0,.85)'; }
function fastOff(e) { block(e); window.__speed = 1; fastBtn.style.background = 'rgba(0,0,0,.6)'; }
fastBtn.addEventListener('pointerdown', fastOn);
fastBtn.addEventListener('pointerup', fastOff);
fastBtn.addEventListener('pointercancel', fastOff);
fastBtn.addEventListener('pointerleave', fastOff);
fastBtn.addEventListener('touchstart', fastOn, {passive:false});
fastBtn.addEventListener('touchend', fastOff, {passive:false});
fastBtn.addEventListener('touchcancel', fastOff, {passive:false});
fastBtn.addEventListener('mousedown', fastOn);
fastBtn.addEventListener('mouseup', fastOff);
document.body.appendChild(fastBtn);

var weapons = document.createElement('div');
weapons.id = 'weapons';
var wbtns = [];
['P', 'S', 'C', 'R'].forEach(function (label, n) {
  var b = document.createElement('div');
  b.className = 'wbtn'; b.textContent = label;
  bind(b);
  b.addEventListener('click', function (e) { block(e); window.setWeapon(n); refreshWeapons(); });
  weapons.appendChild(b); wbtns.push(b);
});
document.body.appendChild(weapons);
function refreshWeapons() {
  var w = window.getGameState ? window.getGameState().wp : 0;
  wbtns.forEach(function (b, i) { b.className = 'wbtn' + (i === w ? ' active' : ''); });
}
setInterval(refreshWeapons, 150);

var savebar = document.createElement('div');
savebar.id = 'savebar';
[['SAVE', function () { window.saveGame(); }], ['LOAD', function () { window.loadGame(); refreshWeapons(); }]].forEach(function (pair) {
  var b = document.createElement('div');
  b.className = 'btn'; b.textContent = pair[0];
  bind(b);
  b.addEventListener('click', function (e) { block(e); pair[1](); });
  savebar.appendChild(b);
});
document.body.appendChild(savebar);

window.musicLoaded = function () { statusEl.textContent = 'Song playing'; };
refreshWeapons();
</script>
</body>
</html>
